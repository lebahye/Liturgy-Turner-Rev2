version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: liturgy-postgres
    environment:
      POSTGRES_DB: liturgy_turner
      POSTGRES_USER: liturgy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liturgy_user -d liturgy_turner"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Liturgy Turner App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liturgy-app
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://liturgy_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/liturgy_turner
      PORT: 5000
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Connect to agent gateway
      CLAWDBOT_GATEWAY_URL: http://agent:29789
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Clawdbot Agent (Project-Specific)
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: liturgy-agent
    ports:
      - "29789:29789"
    environment:
      CLAWDBOT_STATE_DIR: /app/agent/.clawdbot-state
      CLAWDBOT_CONFIG_PATH: /app/agent/clawdbot.json5
      OPENCLAW_GATEWAY_TOKEN: "dev-token-insecure"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Agent can talk to app's HTTP API
      APP_BASE_URL: http://app:5000
    volumes:
      - agent-state:/app/agent/.clawdbot-state
      - ./agent/clawdbot.json5:/app/agent/clawdbot.json5:ro
      - ./agent/skills:/app/agent/skills:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
  agent-state:

networks:
  default:
    name: liturgy-network
