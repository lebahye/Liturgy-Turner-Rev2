services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: liturgy-postgres
    environment:
      POSTGRES_DB: liturgy_turner
      POSTGRES_USER: liturgy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liturgy_user -d liturgy_turner"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Liturgy Turner App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liturgy-app
    ports:
      - "${APP_HOST_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://liturgy_user:${POSTGRES_PASSWORD:-changeme}@postgres:5432/liturgy_turner
      PORT: 5000
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${APP_HOST_PORT:-5000}}
      TRACKER_MODE: ${TRACKER_MODE:-prod}
      TRACKER_LOOKAHEAD: ${TRACKER_LOOKAHEAD:-}
      TRACKER_CONFIDENCE: ${TRACKER_CONFIDENCE:-}
      TRACKER_COOLDOWN_MS: ${TRACKER_COOLDOWN_MS:-}
      TRACKER_EVALUATE_ALWAYS: ${TRACKER_EVALUATE_ALWAYS:-}
      TRACKER_ALLOW_JUMPS: ${TRACKER_ALLOW_JUMPS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Connect to agent gateway
      CLAWDBOT_GATEWAY_URL: http://agent:29789
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./training-data:/app/training-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Clawdbot Agent (Project-Specific)
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: liturgy-agent
    ports:
      - "29789:29789"
      - "29788:29788"
    environment:
      CLAWDBOT_STATE_DIR: /app/agent/.clawdbot-state
      CLAWDBOT_CONFIG_PATH: /app/agent/clawdbot.json5
      OPENCLAW_GATEWAY_TOKEN: ${GATEWAY_TOKEN:-liturgy-secure-token}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # Agent can access app's database and files
      APP_BASE_URL: http://app:5000
      DB_PATH: /app/data/liturgy-turner.db
    volumes:
      # Agent's own state
      - agent-state:/app/agent/.clawdbot-state
      - agent-memory:/app/agent/memory
      - ./agent:/app/agent  # NOT read-only - agent needs to write
      
      # SHARED ACCESS to app's data (READ/WRITE)
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./training-data:/app/training-data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:29789/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  agent-state:
  agent-memory:

networks:
  default:
    name: liturgy-network
