version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: liturgy-postgres
    environment:
      POSTGRES_DB: liturgy_turner
      POSTGRES_USER: liturgy_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liturgy_secure_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liturgy_user -d liturgy_turner"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Liturgy Turner App (WITHOUT agent for now)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: liturgy-app
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://liturgy_user:${POSTGRES_PASSWORD:-liturgy_secure_2024}@postgres:5432/liturgy_turner
      PORT: 5000
      HOST: 0.0.0.0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Wire audio capture to native audio-api process on host
      AGENT_AUDIO_API_URL: ${AGENT_AUDIO_API_URL:-http://host.docker.internal:29788}
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
      - ./training-data:/app/training-data:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  default:
    name: liturgy-network
